# Lint / typecheck / test: the same commands `just check` runs locally. Not
# path-filtered, so it is safe to mark required. The release workflow calls it
# too, so no image ships from a commit these checks have not passed on.
#
# Tests run against a real Oxigraph that test/oxigraph.ts starts with the
# runner's Docker, from the one digest pinned there; a service container here
# would be a second copy of that pin.
name: checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_call:

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: lint / typecheck / test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # biome is a devshell tool (flake.nix), not a package dependency. The
      # version tracks flake.nix's toolbox and the `$schema` pin in biome.json.
      - name: Setup biome
        uses: biomejs/setup-biome@4c91541eaada48f67d7dbd7833600ce162b68f51 # v2.7.1
        with:
          version: 2.5.2

      - name: Lint
        run: biome check .

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Test
        run: pnpm exec vitest run
